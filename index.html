<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IDE Controller</title>
    <link rel="stylesheet" href="../../fontawesome/css/all.min.css">
    <style>
        :root {
            --vscode-blue: #007acc;
            --bg: #1e1e1e;
            --card-bg: #252526;
            --text: #cccccc;
            --text-dim: #858585;
            --success: #89d185;
            --error: #f48771;
            --border: #333333;
            --input-bg: #3c3c3c;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: var(--card-bg);
            width: 95%;
            max-width: 750px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .header {
            background: #333333;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 10px; color: #ffffff;}
        .title i { color: var(--vscode-blue); font-size: 20px; }
        
        /* 语言切换按钮 */
        .lang-switch {
            background: transparent;
            border: 1px solid #555;
            color: var(--text);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .lang-switch:hover { border-color: var(--vscode-blue); color: var(--vscode-blue); }

        .main-content { padding: 30px; }
        .status-section { text-align: center; margin-bottom: 25px; }
        
        .status-badge { display: inline-block; padding: 6px 16px; border-radius: 4px; font-weight: bold; font-size: 13px; background: #333; color: #888; margin-bottom: 15px; text-transform: uppercase; }
        .status-running { background: rgba(137, 209, 133, 0.15); color: var(--success); }
        .status-starting { background: rgba(0, 122, 204, 0.15); color: var(--vscode-blue); }
        .status-error { background: rgba(244, 135, 113, 0.15); color: var(--error); }

        /* 路径输入区域 */
        .input-group {
            margin: 0 auto 20px auto;
            max-width: 500px;
            text-align: left;
        }
        .input-label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; display: block; }
        .path-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            outline: none;
        }
        .path-input:focus { border-color: var(--vscode-blue); }
        .path-input:disabled { opacity: 0.6; cursor: not-allowed; }

        .url-outer { max-width: 500px; margin: 0 auto; display: none; flex-direction: column; gap: 15px; }
        
        .controls { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
        .btn { border: none; padding: 10px 24px; border-radius: 4px; font-weight: 500; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-start { background: var(--vscode-blue); color: #fff; }
        .btn-stop { background: #4d4d4d; color: #fff; }
        .btn-open { background: var(--success); color: #1e1e1e; font-weight: 600; width: 100%; justify-content: center; padding: 14px;}
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
        .info-col h4 { margin: 0 0 10px 0; font-size: 13px; color: #fff; }
        .info-col p { color: var(--text-dim); font-size: 12px; line-height: 1.6; margin: 0; }

        .logs-container {
            background: #1e1e1e;
            border-radius: 6px;
            padding: 12px;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 12px;
            color: #d4d4d4;
            height: 120px;
            overflow-y: auto;
            margin-top: 20px;
            border: 1px solid var(--border);
            text-align: left;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="title"><i class="fa-solid fa-code"></i> <span>Web IDE</span></div>
        <button class="lang-switch" onclick="toggleLang()"><i class="fa-solid fa-globe"></i> <span id="langBtnText">EN</span></button>
    </div>

    <div class="main-content">
        <div class="status-section">
            <div id="statusBadge" class="status-badge">READY</div>
            
            <!-- 工作区输入 -->
            <div class="input-group">
                <label class="input-label" data-i18n="workspaceLabel">Workspace Path</label>
                <input type="text" id="workspacePath" class="path-input" placeholder="Loading...">
            </div>

            <!-- 运行成功后显示的操作区 -->
            <div id="urlOuter" class="url-outer">
                <p style="margin:0; font-size: 13px; color: var(--text-dim);" data-i18n="runningMsg">Service started on local port:</p>
                <button class="btn btn-open" onclick="openIDE()" id="openBtn">
                    <i class="fa-solid fa-external-link-alt"></i> <span data-i18n="btnOpen">Open IDE</span>
                </button>
            </div>
        </div>

        <div class="controls">
            <button id="btnStart" class="btn btn-start" onclick="start()">
                <i class="fa-solid fa-play"></i> <span data-i18n="btnStart">Start IDE</span>
            </button>
            <button id="btnStop" class="btn btn-stop" onclick="stop()" disabled>
                <i class="fa-solid fa-square"></i> <span data-i18n="btnStop">Stop</span>
            </button>
        </div>

        <div class="info-grid">
            <div class="info-col">
                <h4><i class="fa-solid fa-bolt" style="color:#e2c08d"></i> <span data-i18n="featureTitle">Features</span></h4>
                <p data-i18n="featureDesc">Runs a full VS Code environment via code-server. Supports extensions, terminal, and syntax highlighting.</p>
            </div>
            <div class="info-col">
                <h4><i class="fa-solid fa-circle-info" style="color:#75beff"></i> <span data-i18n="noteTitle">Note</span></h4>
                <p data-i18n="noteDesc">For the best experience (WebSocket support), this service runs on a dedicated local port. Click 'Open IDE' to launch.</p>
            </div>
        </div>

        <div id="logs" class="logs-container">Waiting...</div>
    </div>
</div>

<script>
    const translations = {
        zh: {
            statusReady: "就绪",
            statusStarting: "启动中...",
            statusRunning: "运行中",
            statusError: "错误",
            workspaceLabel: "工作区路径 (文件夹)",
            runningMsg: "服务已在本地独立端口启动完成：",
            btnOpen: "打开 IDE",
            btnStart: "启动 IDE",
            btnStop: "停止",
            featureTitle: "功能说明",
            featureDesc: "启动基于 code-server 的完整 VS Code 环境。支持安装插件、终端访问以及全功能语法高亮。",
            noteTitle: "注意事项",
            noteDesc: "由于 IDE 强依赖 WebSocket，启动后将为您分配独立端口，请点击上方按钮在浏览器新标签页中打开。",
            logWait: "等待操作..."
        },
        en: {
            statusReady: "READY",
            statusStarting: "STARTING...",
            statusRunning: "RUNNING",
            statusError: "ERROR",
            workspaceLabel: "Workspace Path (Directory)",
            runningMsg: "Service started on local port:",
            btnOpen: "Open IDE",
            btnStart: "Start IDE",
            btnStop: "Stop",
            featureTitle: "Features",
            featureDesc: "Runs a full VS Code environment via code-server. Supports extensions, terminal, and syntax highlighting.",
            noteTitle: "Note",
            noteDesc: "Requires WebSocket support. Runs on a dedicated local port. Click 'Open IDE' to launch in a new tab.",
            logWait: "Waiting..."
        }
    };

    let curLang = 'zh'; // 默认中文
    let pollInterval;
    let lastStatusData = null;
    let ideUrl = "";
    let isPathLoaded = false;

    // 切换语言
    function setLanguage(lang) {
        curLang = lang;
        const t = translations[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.innerText = t[key];
        });
        document.getElementById('langBtnText').innerText = lang === 'zh' ? 'EN' : '中文';
        
        // 刷新状态文字
        if(lastStatusData) renderData(lastStatusData);
    }

    function toggleLang() { setLanguage(curLang === 'zh' ? 'en' : 'zh'); }

    async function updateUI() {
        try {
            const res = await fetch('api/status');
            const data = await res.json();
            lastStatusData = data;
            
            // 首次加载时填充默认路径
            if (!isPathLoaded && data.defaultHome) {
                const input = document.getElementById('workspacePath');
                if (!input.value) {
                    input.value = data.currentWorkspace || data.defaultHome;
                }
                isPathLoaded = true;
            }
            
            renderData(data);
        } catch(e) {}
    }

    function renderData(d) {
        const t = translations[curLang];
        const badge = document.getElementById('statusBadge');
        const urlOuter = document.getElementById('urlOuter');
        const logs = document.getElementById('logs');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const inputPath = document.getElementById('workspacePath');

        if(d.logs.length) { 
            logs.innerText = d.logs.join('\n'); 
            logs.scrollTop = logs.scrollHeight; 
        } else {
            logs.innerText = t.logWait;
        }

        badge.className = 'status-badge'; 
        if (d.status === 'starting') {
            badge.innerText = t.statusStarting;
            badge.classList.add('status-starting');
            btnStart.disabled = true;
            inputPath.disabled = true; 
            urlOuter.style.display = 'none';
        } else if (d.status === 'running') {
            badge.innerText = t.statusRunning;
            badge.classList.add('status-running');
            urlOuter.style.display = 'flex';
            
            // =========== 核心修复点 ===========
            // 强制在 URL 中带上 folder 参数，覆盖 VS Code 的"恢复上一次会话"机制
            const encodedPath = encodeURIComponent(d.currentWorkspace);
            ideUrl = `http://127.0.0.1:${d.port}/?folder=${encodedPath}`;
            // =================================
            
            if (d.currentWorkspace) inputPath.value = d.currentWorkspace;
            
            btnStart.disabled = true;
            btnStop.disabled = false;
            inputPath.disabled = true; 
        } else if (d.status === 'error') {
            // ... (保持不变)
            badge.innerText = t.statusError;
            badge.classList.add('status-error');
            urlOuter.style.display = 'none';
            btnStart.disabled = false;
            btnStop.disabled = true;
            inputPath.disabled = false;
        } else {
            // ... (保持不变)
            badge.innerText = t.statusReady;
            urlOuter.style.display = 'none';
            btnStart.disabled = false;
            btnStop.disabled = true;
            inputPath.disabled = false;
        }
        
        if (d.status === 'starting') {
            if (pollInterval) clearTimeout(pollInterval);
            pollInterval = setTimeout(updateUI, 1000);
        }
    }

    async function start() {
        const pathVal = document.getElementById('workspacePath').value;
        const btn = document.getElementById('btnStart');
        
        // 简单前端校验
        if(!pathVal) {
            alert(curLang === 'zh' ? "请输入工作区路径" : "Please enter workspace path");
            return;
        }

        btn.disabled = true;
        
        try {
            const res = await fetch('api/start', { 
                method:'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ workspacePath: pathVal })
            });
            
            if (!res.ok) {
                const errData = await res.json();
                alert((curLang === 'zh' ? "启动失败: " : "Start failed: ") + (errData.error || "Unknown error"));
                btn.disabled = false;
            }
            updateUI();
        } catch(e) {
            alert("Network Error");
            btn.disabled = false;
        }
    }

    async function stop() {
        await fetch('api/stop', { method:'POST' });
        setTimeout(updateUI, 500);
    }

    function openIDE() {
        if(ideUrl) {
            window.open(ideUrl, '_blank');
        }
    }

    // 初始化
    setLanguage('zh'); // 默认中文
    updateUI();
</script>
</body>
</html>
